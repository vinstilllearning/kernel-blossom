name: Kernel build (Redmi 9C angelica - container + KernelSU Next)

on:
  workflow_dispatch:
    inputs:
      kernel_url:
        description: "Kernel Git URL (https clone URL of your angelica / blossom 4.19 tree)"
        required: true
        type: string
      kernel_branch:
        description: "Kernel branch or tag to build"
        required: true
        type: string
      defconfig:
        description: "Defconfig name in arch/arm64/configs/ (angelica_defconfig, angelican_defconfig or blossom_defconfig)"
        required: true
        default: "angelica_defconfig"
        type: string
      ksu_ref:
        description: "KernelSU-Next branch/tag passed to setup.sh (empty = script default; e.g. legacy for old kernels)"
        required: false
        default: ""
        type: string
      apply_droidspaces_patches:
        description: "Apply Droidspaces' non-GKI kernel patches"
        required: false
        default: true
        type: boolean
      toolchain_url:
        description: "Git repo of a Clang + binutils toolchain (must ship aarch64-linux-gnu- and arm-linux-gnueabi- binutils)"
        required: false
        default: "https://github.com/kdrag0n/proton-clang"
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build Image.gz-dtb + AnyKernel3 zip
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    env:
      # Inputs go through env vars (never interpolated into scripts).
      KERNEL_URL: ${{ inputs.kernel_url }}
      KERNEL_BRANCH: ${{ inputs.kernel_branch }}
      DEFCONFIG: ${{ inputs.defconfig }}
      KSU_REF: ${{ inputs.ksu_ref }}
      TOOLCHAIN_URL: ${{ inputs.toolchain_url }}
      # KernelSU-Next installer. Change here if the project moves.
      KSU_SETUP_URL: "https://raw.githubusercontent.com/rifsxd/KernelSU-Next/next/kernel/setup.sh"
      KBUILD_BUILD_USER: github-actions
      KBUILD_BUILD_HOST: ubuntu
      MAKE_ARGS: >-
        O=out ARCH=arm64 SUBARCH=arm64
        CC=clang
        CROSS_COMPILE=aarch64-linux-gnu-
        CROSS_COMPILE_ARM32=arm-linux-gnueabi-
        CLANG_TRIPLE=aarch64-linux-gnu-

    steps:
      - name: Checkout builder repo (setup_container_cfg.sh)
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ca-certificates cpio curl device-tree-compiler \
            dwarves flex gawk git kmod libelf-dev libncurses-dev libssl-dev lz4 \
            patch python3 python-is-python3 rsync u-boot-tools unzip wget xz-utils zip zstd
          # Optional / legacy packages: not on every Ubuntu release, so never fatal.
          for pkg in python2 libtinfo5 libncurses5; do
            sudo apt-get install -y --no-install-recommends "$pkg" \
              || echo "::notice::optional package $pkg is not available - continuing"
          done
          pahole --version || true

      - name: Clone kernel source
        run: |
          git clone --depth=1 --single-branch --branch "$KERNEL_BRANCH" "$KERNEL_URL" kernel
          git -C kernel log -1 --format='Building %h  %s'

      - name: Prepare tree (version + defconfig sanity, host-gcc fix)
        working-directory: kernel
        run: |
          KVER="$(make -s kernelversion)"
          echo "Kernel version: $KVER"
          case "$KVER" in
            4.19.*) ;;
            *) echo "::warning::Tree reports kernel $KVER but this workflow targets 4.19.x - check the branch you selected" ;;
          esac

          if [ ! -f "arch/arm64/configs/$DEFCONFIG" ]; then
            echo "::error::arch/arm64/configs/$DEFCONFIG not found. Candidates:"
            ls arch/arm64/configs | grep -Ei 'angelica|blossom|mt6765' || true
            exit 1
          fi

          # 4.19 trees older than ~4.19.139 fail to link host dtc with GCC >= 10
          # ("multiple definition of yylloc"). Harmless no-op on fixed trees.
          for f in scripts/dtc/dtc-lexer.l scripts/dtc/dtc-lexer.lex.c_shipped; do
            if [ -f "$f" ]; then sed -i 's/^YYLTYPE yylloc;/extern YYLTYPE yylloc;/' "$f"; fi
          done

          echo "KVER=$KVER" >> "$GITHUB_ENV"

      - name: Fetch Clang + binutils toolchain
        run: |
          git clone --depth=1 "$TOOLCHAIN_URL" clang
          echo "$GITHUB_WORKSPACE/clang/bin" >> "$GITHUB_PATH"
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          clang --version | sed -n '1p'
          if ! command -v aarch64-linux-gnu-ld > /dev/null; then
            echo "::error::aarch64-linux-gnu- binutils not found in $TOOLCHAIN_URL - pick a toolchain that bundles binutils"
            exit 1
          fi
          if ! command -v arm-linux-gnueabi-ld > /dev/null; then
            echo "::warning::arm-linux-gnueabi- binutils not found - the 32-bit vDSO (CROSS_COMPILE_ARM32) will fail if CONFIG_COMPAT_VDSO=y"
          fi

      - name: Integrate KernelSU Next
        working-directory: kernel
        run: |
          SKIP_REF_CHECK=0
          if [ -e drivers/kernelsu ] || [ -d KernelSU ] || [ -d KernelSU-Next ]; then
            echo "::warning::Tree already contains a KernelSU driver - not running setup.sh again"
            SKIP_REF_CHECK=1
          elif [ -n "$KSU_REF" ]; then
            curl -LSs "$KSU_SETUP_URL" | bash -s -- "$KSU_REF"
          else
            curl -LSs "$KSU_SETUP_URL" | bash -
          fi

          if [ ! -e drivers/kernelsu ]; then
            echo "::error::drivers/kernelsu is missing - KernelSU Next setup failed"
            exit 1
          fi

          KSU_REPO="$(git -C "$(readlink -f drivers/kernelsu)" rev-parse --show-toplevel)"
          echo "KernelSU repo: $KSU_REPO"
          git -C "$KSU_REPO" log -1 --format='KernelSU @ %h (%D)'

          # setup.sh silently stays on its default branch when the requested
          # ref does not exist - catch that instead of building the wrong thing.
          if [ -n "$KSU_REF" ] && [ "$SKIP_REF_CHECK" = 0 ]; then
            want="$(git -C "$KSU_REPO" rev-parse -q --verify "${KSU_REF}^{commit}" \
                    || git -C "$KSU_REPO" rev-parse -q --verify "origin/${KSU_REF}^{commit}" \
                    || true)"
            have="$(git -C "$KSU_REPO" rev-parse HEAD)"
            if [ -z "$want" ] || [ "$want" != "$have" ]; then
              echo "::error::KernelSU-Next is not on '$KSU_REF' (ref missing in that repo?). Fix ksu_ref or KSU_SETUP_URL."
              exit 1
            fi
          fi

      - name: Apply Droidspaces non-GKI kernel patches
        if: ${{ inputs.apply_droidspaces_patches }}
        run: |
          git clone --depth=1 https://github.com/ravindu644/Droidspaces-OSS "$RUNNER_TEMP/droidspaces"
          PDIR="$RUNNER_TEMP/droidspaces/Documentation/resources/kernel-patches/non-GKI"
          if [ ! -d "$PDIR" ]; then
            echo "::warning::$PDIR not found upstream - skipping Droidspaces patches"
            exit 0
          fi
          cd kernel
          shopt -s nullglob
          applied=0
          skipped=0
          for p in "$PDIR"/*.patch; do
            if patch -p1 -N --dry-run -s < "$p" > /dev/null 2>&1; then
              patch -p1 -N -s < "$p"
              echo "applied: $(basename "$p")"
              applied=$((applied + 1))
            else
              echo "::warning::does not apply cleanly, skipped: $(basename "$p")"
              skipped=$((skipped + 1))
            fi
          done
          echo "Droidspaces patches: $applied applied, $skipped skipped"

      - name: Enable container / Droidspaces options (setup_container_cfg.sh)
        working-directory: kernel
        run: |
          bash "$GITHUB_WORKSPACE/setup_container_cfg.sh" patch "$DEFCONFIG" --ksu
          git --no-pager diff --stat -- "arch/arm64/configs/$DEFCONFIG" || true

      - name: Generate .config (make defconfig)
        working-directory: kernel
        run: |
          make $MAKE_ARGS "$DEFCONFIG"
          test -s out/.config

      - name: Verify out/.config (USER_NS / PID_NS must survive Kconfig)
        working-directory: kernel
        run: |
          CFG=out/.config
          # 1. The two options Kconfig dependencies most often drop silently.
          fail=0
          for s in USER_NS PID_NS; do
            if grep -qx "CONFIG_${s}=y" "$CFG"; then
              echo "OK    CONFIG_${s}=y"
            else
              echo "::error::CONFIG_${s}=y is NOT in out/.config (found: $(grep -E "^(# )?CONFIG_${s}( |=)" "$CFG" || echo absent))"
              grep -n -A12 -E "^config ${s}\$" init/Kconfig || true
              fail=1
            fi
          done
          [ "$fail" = 0 ] || exit 1
          # 2. Full list (namespaces, cgroups, overlayfs, netfilter, KernelSU, ...).
          bash "$GITHUB_WORKSPACE/setup_container_cfg.sh" verify "$CFG" --ksu

      - name: Build kernel (Image.gz-dtb)
        working-directory: kernel
        run: |
          make $MAKE_ARGS olddefconfig
          # olddefconfig can still change things - re-check before the long build.
          bash "$GITHUB_WORKSPACE/setup_container_cfg.sh" verify out/.config --ksu
          SECONDS=0
          make -j"$(nproc)" $MAKE_ARGS Image.gz-dtb 2>&1 | tee "$GITHUB_WORKSPACE/build.log"
          IMG=out/arch/arm64/boot/Image.gz-dtb
          if [ ! -s "$IMG" ]; then
            echo "::error::$IMG was not produced"
            ls -la out/arch/arm64/boot || true
            exit 1
          fi
          echo "Built $(du -h "$IMG" | cut -f1) Image.gz-dtb in $((SECONDS / 60)) min"

      - name: Package flashable zip (AnyKernel3)
        run: |
          IMG="$GITHUB_WORKSPACE/kernel/out/arch/arm64/boot/Image.gz-dtb"
          SHA="$(git -C kernel rev-parse --short HEAD)"
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 AnyKernel3
          cd AnyKernel3
          rm -rf .git .github ./*.md
          cp "$IMG" ./Image.gz-dtb

          cat > anykernel.sh <<'EOF'
          ### AnyKernel3 Ramdisk Mod Script (generated by kernel_build.yml)

          ### AnyKernel setup
          # global properties
          properties() { '
          kernel.string=Container kernel @KVER@ (@SHA@) - Droidspaces/LXC/Docker + KernelSU Next
          do.devicecheck=1
          do.modules=0
          do.systemless=0
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=angelica
          device.name2=angelican
          device.name3=blossom
          '; } # end properties

          ### AnyKernel install
          ## boot files attributes
          boot_attributes() {
          set_perm_recursive 0 0 755 644 $RAMDISK/*;
          set_perm_recursive 0 0 750 750 $RAMDISK/init* $RAMDISK/sbin;
          } # end attributes

          # boot shell variables (Redmi 9C is non-A/B; MTK by-name paths)
          BLOCK=boot;
          for p in /dev/block/bootdevice/by-name/boot /dev/block/platform/bootdevice/by-name/boot /dev/block/by-name/boot; do
            if [ -e "$p" ]; then BLOCK="$p"; break; fi;
          done;
          IS_SLOT_DEVICE=0;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;

          # import functions/variables and setup patching - see for reference (DO NOT REMOVE)
          . tools/ak3-core.sh;

          # boot install
          dump_boot;

          # begin ramdisk changes
          # (none - kernel-only flash)
          # end ramdisk changes

          write_boot;
          ## end boot install
          EOF

          sed -i "s|@KVER@|$KVER|g; s|@SHA@|$SHA|g" anykernel.sh
          ZIP="Redmi9C-container-kernel-${KVER}-${SHA}-$(date -u +%Y%m%d-%H%M).zip"
          zip -r9 "$GITHUB_WORKSPACE/$ZIP" . -x '.git*' > /dev/null
          unzip -l "$GITHUB_WORKSPACE/$ZIP" | tail -n 15
          echo "ZIP_NAME=$ZIP" >> "$GITHUB_ENV"
          echo "ZIP_PATH=$GITHUB_WORKSPACE/$ZIP" >> "$GITHUB_ENV"

      - name: Upload flashable zip
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_PATH }}
          if-no-files-found: error
          compression-level: 0

      - name: Upload .config and build log
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.run_id }}
          path: |
            build.log
            kernel/out/.config
          if-no-files-found: ignore
